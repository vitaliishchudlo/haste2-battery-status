name: Release (Windows)
on:
  push:
    tags: ['v*-win']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches package version
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0,'src'); import haste2_battery; print(haste2_battery.__version__)"
          if ("v$v-win" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != package version $v" }
      - name: Stamp file version into the exe metadata
        shell: python
        run: |
          import re, sys
          sys.path.insert(0, 'src')
          from haste2_battery import __version__ as v
          path = 'installers/windows/version_info.txt'
          text = open(path, encoding='utf-8').read()
          nums = ','.join(([*v.split('.'), '0', '0', '0'])[:4])
          text = re.sub(r'(filevers|prodvers)=\([\d,]+\)', lambda m: f'{m[1]}=({nums})', text)
          text = re.sub(r"('(?:FileVersion|ProductVersion)', ')[\d.]+'", lambda m: f"{m[1]}{v}'", text)
          open(path, 'w', encoding='utf-8').write(text)
          print(text)
      - run: python -m pip install hidapi==0.15.0 pystray==0.19.5 "Pillow>=10.1,<14" "pyinstaller>=6.11,<7"
      - name: Build single-file installer
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Haste2Battery-Setup
          --icon assets/haste2.ico --version-file installers/windows/version_info.txt
          --hidden-import pystray._win32 --paths src installers/windows/launcher.pyw
      - name: Checksum for the auto-updater
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/Haste2Battery-Setup.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content dist/Haste2Battery-Setup.exe.sha256 -Value "$h  Haste2Battery-Setup.exe" -Encoding ascii
      - name: Release title and notes from CHANGELOG
        id: notes
        run: python .github/release_notes.py "$(python -c "import sys; sys.path.insert(0,'src'); import haste2_battery; print(haste2_battery.__version__)")" Windows
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          files: |
            dist/Haste2Battery-Setup.exe
            dist/Haste2Battery-Setup.exe.sha256
          make_latest: true   # "latest" = newest Windows release, so the README download link stays valid
