name: Release (macOS)
on:
  push:
    tags: ['v*-mac']
    branches: ['macos-**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches package version
        if: endsWith(github.ref, '-mac')
        run: |
          v=$(python -c "import sys; sys.path.insert(0,'src'); import haste2_battery; print(haste2_battery.__version__)")
          [ "v$v-mac" = "${{ github.ref_name }}" ] || { echo "Tag ${{ github.ref_name }} != package version $v"; exit 1; }
      - name: Build .app, tar.gz and dmg
        run: bash installers/macos/build.sh
      - name: Smoke test install.sh (install, autostart entry, uninstall)
        env:
          HASTE2_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'echo "::error::smoke test failed at line $LINENO: $BASH_COMMAND"' ERR
          export HASTE2_ARCHIVE_URL="file://$PWD/dist/Haste2Battery-macos-arm64.tar.gz"
          bash installers/macos/install.sh
          APP="$HOME/Applications/Haste2Battery.app"
          PLIST="$HOME/Library/LaunchAgents/com.haste2battery.app.plist"
          test -d "$APP"
          test -f "$PLIST"
          plutil -lint "$PLIST"
          grep -q "$APP/Contents/MacOS/Haste2Battery" "$PLIST"
          "$APP/Contents/MacOS/Haste2Battery" --version
          # packaged app can reach GitHub (certificates); retried, since the network can blip
          ok=0
          for attempt in 1 2 3; do
            if out=$("$APP/Contents/MacOS/Haste2Battery" --check-update 2>&1); then ok=1; echo "$out"; break; fi
            echo "attempt $attempt failed: $out"; sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::--check-update failed: $out"; exit 1; }
          codesign --verify --deep --strict "$APP"
          bash installers/macos/install.sh --uninstall
          test ! -e "$APP"
          test ! -e "$PLIST"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/Haste2Battery-macos-arm64.*
      - name: Release title and notes from CHANGELOG
        id: notes
        if: endsWith(github.ref, '-mac')
        run: python .github/release_notes.py "$(python -c "import sys; sys.path.insert(0,'src'); import haste2_battery; print(haste2_battery.__version__)")" macOS
      - uses: softprops/action-gh-release@v2
        if: endsWith(github.ref, '-mac')
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          files: |
            dist/Haste2Battery-macos-arm64.tar.gz
            dist/Haste2Battery-macos-arm64.dmg
          make_latest: false   # install.sh and the updater look the macOS release up themselves
