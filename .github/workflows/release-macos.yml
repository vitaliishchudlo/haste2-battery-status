name: Release (macOS)
on:
  push:
    tags: ['mac-v*']
    branches: ['macos-**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/mac-v')
        run: |
          v=$(python -c "import sys; sys.path.insert(0,'src'); import haste2_battery; print(haste2_battery.__version__)")
          [ "mac-v$v" = "${{ github.ref_name }}" ] || { echo "Tag ${{ github.ref_name }} != package version $v"; exit 1; }
      - name: Build .app, tar.gz and dmg
        run: bash installers/macos/build.sh
      - name: Smoke test install.sh (install, autostart entry, uninstall)
        run: |
          set -euo pipefail
          trap 'echo "::error::smoke test failed at line $LINENO: $BASH_COMMAND"' ERR
          export HASTE2_ARCHIVE_URL="file://$PWD/dist/Haste2Battery-macos-arm64.tar.gz"
          bash installers/macos/install.sh
          APP="$HOME/Applications/Haste2Battery.app"
          PLIST="$HOME/Library/LaunchAgents/com.haste2battery.app.plist"
          test -d "$APP"
          test -f "$PLIST"
          plutil -lint "$PLIST"
          grep -q "$APP/Contents/MacOS/Haste2Battery" "$PLIST"
          "$APP/Contents/MacOS/Haste2Battery" --version
          codesign --verify --deep --strict "$APP"
          bash installers/macos/install.sh --uninstall
          test ! -e "$APP"
          test ! -e "$PLIST"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/Haste2Battery-macos-arm64.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/mac-v')
        with:
          files: |
            dist/Haste2Battery-macos-arm64.tar.gz
            dist/Haste2Battery-macos-arm64.dmg
          generate_release_notes: true
          make_latest: false   # install.sh and the updater look the macOS release up themselves
