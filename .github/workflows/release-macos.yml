name: Release (macOS)
on:
  push:
    tags: ['v*']
    branches: ['macos-**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import sys; sys.path.insert(0,'src'); import haste2_battery; print(haste2_battery.__version__)")
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "Tag ${{ github.ref_name }} != package version $v"; exit 1; }
      - name: Build .app, tar.gz and dmg
        run: bash installers/macos/build.sh
      - name: Smoke test install.sh (install, autostart, launch, uninstall)
        run: |
          set -euo pipefail
          export HASTE2_ARCHIVE_URL="file://$PWD/dist/Haste2Battery-macos-arm64.tar.gz"
          bash installers/macos/install.sh
          APP="$HOME/Applications/Haste2Battery.app"
          PLIST="$HOME/Library/LaunchAgents/com.haste2battery.app.plist"
          test -d "$APP"
          test -f "$PLIST"
          plutil -lint "$PLIST"
          grep -q "$APP/Contents/MacOS/Haste2Battery" "$PLIST"
          "$APP/Contents/MacOS/Haste2Battery" --version
          codesign --verify --deep --strict "$APP"
          plutil -extract LSUIElement raw "$APP/Contents/Info.plist" | grep -qx true
          sleep 10
          pgrep -x Haste2Battery || { echo "App is not running"; cat "$HOME/Library/Application Support/Haste2Battery/startup-error.txt" 2>/dev/null || true; exit 1; }
          test ! -f "$HOME/Library/Application Support/Haste2Battery/startup-error.txt"
          # running installer again must update in place
          bash installers/macos/install.sh
          sleep 5
          pgrep -x Haste2Battery
          bash installers/macos/install.sh --uninstall
          test ! -e "$APP"
          test ! -e "$PLIST"
          ! pgrep -x Haste2Battery
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/Haste2Battery-macos-arm64.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/Haste2Battery-macos-arm64.tar.gz
            dist/Haste2Battery-macos-arm64.dmg
            installers/macos/install.sh
          generate_release_notes: true
